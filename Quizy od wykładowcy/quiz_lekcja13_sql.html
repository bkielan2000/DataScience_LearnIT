<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Lekcja 13: SQL | DS02-05-26</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --card:      #1c2128;
    --border:    #30363d;
    --border2:   #21262d;
    --text:      #e6edf3;
    --muted:     #7d8590;
    --indigo:    #79c0ff;
    --indigo-bg: rgba(121,192,255,.08);
    --indigo-bd: rgba(121,192,255,.25);
    --green:     #3fb950;
    --green-bg:  rgba(63,185,80,.10);
    --green-bd:  rgba(63,185,80,.30);
    --red:       #f85149;
    --red-bg:    rgba(248,81,73,.10);
    --red-bd:    rgba(248,81,73,.30);
    --amber:     #e3b341;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', system-ui, sans-serif;
    --kw:        #ff7b72;
    --fn:        #d2a8ff;
    --str:       #a5d6ff;
    --num:       #79c0ff;
    --cmt:       #8b949e;
  }

  html { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }
  body { display: flex; flex-direction: column; align-items: center; padding: 40px 16px 60px; }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 32px; }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }
  .title { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: var(--muted); }

  /* ── PROGRESS ── */
  .progress-wrap { width: 100%; max-width: 680px; margin-bottom: 24px; }
  .progress-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); font-family: var(--mono);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 4px; background: var(--border); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #388bfd, #79c0ff);
    border-radius: 99px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  /* ── CARD ── */
  .card {
    width: 100%; max-width: 680px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .card-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border2);
    display: flex; align-items: flex-start; gap: 14px;
  }
  .q-badge {
    flex-shrink: 0;
    width: 32px; height: 32px;
    background: var(--indigo-bg); border: 1px solid var(--indigo-bd);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--indigo);
  }
  .q-text { font-size: 16px; line-height: 1.6; color: var(--text); font-weight: 500; }
  .q-tag {
    display: inline-block; margin-bottom: 6px;
    padding: 2px 8px; border-radius: 4px;
    background: var(--indigo-bg); border: 1px solid var(--indigo-bd);
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--indigo); letter-spacing: .05em;
  }

  /* ── CODE SNIPPET ── */
  .code-wrap { padding: 12px 24px 0; }
  .code-block {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
    font-family: var(--mono); font-size: 13px; line-height: 1.7;
    overflow-x: auto; white-space: pre;
  }
  .kw  { color: var(--kw); font-weight: 600; }
  .fn  { color: var(--fn); }
  .str { color: var(--str); }
  .num { color: var(--num); }
  .cmt { color: var(--cmt); font-style: italic; }
  .tbl { color: #ffa657; }

  /* ── OPTIONS ── */
  .options { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer;
    font-size: 14px; line-height: 1.5; color: var(--text);
    transition: border-color .15s, background .15s, transform .1s;
    text-align: left; width: 100%;
  }
  .option:hover:not(.disabled) {
    border-color: var(--indigo); background: var(--indigo-bg);
    transform: translateX(2px);
  }
  .option.correct {
    border-color: var(--green-bd) !important;
    background: var(--green-bg) !important;
  }
  .option.wrong {
    border-color: var(--red-bd) !important;
    background: var(--red-bg) !important;
  }
  .option.disabled { cursor: default; }
  .option-letter {
    flex-shrink: 0; width: 26px; height: 26px;
    border: 1px solid var(--border); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--muted);
    transition: all .15s;
  }
  .option:hover:not(.disabled) .option-letter {
    border-color: var(--indigo); color: var(--indigo); background: var(--indigo-bg);
  }
  .option.correct .option-letter { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .option.wrong   .option-letter { border-color: var(--red);   color: var(--red);   background: var(--red-bg);   }
  .option-code { font-family: var(--mono); font-size: 13px; }

  /* ── FEEDBACK ── */
  .feedback {
    margin: 0 24px 20px;
    padding: 12px 16px;
    border-radius: 8px; font-size: 13px; line-height: 1.6;
    display: none;
  }
  .feedback.show { display: flex; gap: 10px; align-items: flex-start; }
  .feedback.correct { background: var(--green-bg); border: 1px solid var(--green-bd); color: #7ee787; }
  .feedback.wrong   { background: var(--red-bg);   border: 1px solid var(--red-bd);   color: #ffa198; }
  .feedback-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  /* ── NAV ── */
  .card-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border2);
    display: flex; justify-content: flex-end;
  }
  .btn {
    padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: #388bfd; color: #fff;
  }
  .btn-primary:hover { opacity: .85; }
  .btn-primary:disabled { opacity: .35; cursor: default; }

  /* ── SCORE SCREEN ── */
  #score-screen { display: none; width: 100%; max-width: 680px; }
  .score-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 32px; text-align: center;
  }
  .score-ring {
    width: 120px; height: 120px; margin: 0 auto 24px;
    position: relative;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring-bg    { fill: none; stroke: var(--border); stroke-width: 8; }
  .score-ring-fill  { fill: none; stroke-width: 8; stroke-linecap: round;
                      transition: stroke-dashoffset 1s cubic-bezier(.4,0,.2,1); }
  .score-number {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column;
  }
  .score-big { font-size: 28px; font-weight: 700; font-family: var(--mono); }
  .score-denom { font-size: 13px; color: var(--muted); font-family: var(--mono); }
  .score-label { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .score-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .score-breakdown {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px;
    margin-bottom: 28px;
  }
  .score-dot {
    height: 6px; border-radius: 99px;
    background: var(--green);
  }
  .score-dot.wrong { background: var(--red); }

  .review-list { text-align: left; margin-bottom: 28px; }
  .review-item {
    padding: 12px 16px; border-radius: 8px; margin-bottom: 8px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; display: flex; gap: 10px; align-items: flex-start;
  }
  .review-item.correct-r { border-color: var(--green-bd); }
  .review-item.wrong-r   { border-color: var(--red-bd); }
  .review-q { color: var(--muted); flex-shrink: 0; font-family: var(--mono); }
  .review-text { line-height: 1.5; }
  .review-correct { color: var(--green); font-size: 11px; font-family: var(--mono); margin-top: 3px; }

  .btn-restart {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); padding: 11px 28px;
    border-radius: 8px; font-family: var(--sans); font-size: 14px;
    font-weight: 600; cursor: pointer; transition: border-color .15s;
  }
  .btn-restart:hover { border-color: var(--indigo); }
</style>
</head>

  <div class="eyebrow">DS02-05-26 · LearnIT</div>

<div class="progress-wrap">

    <span id="prog-label">Pytanie 1 z 10</span>
    <span id="prog-score">0 / 0</span>

  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:10%"></div></div>
</div>

<!-- QUIZ CARD -->
<div class="card" id="quiz-card">
  <div class="card-header">
    <div class="q-badge" id="q-badge">1</div>
    <div>
      <div class="q-tag" id="q-tag">TAG</div>
      <div class="q-text" id="q-text">Pytanie...</div>

                stroke-dasharray="326.7" stroke-dashoffset="326.7"/>

<script>
const QUESTIONS = [
  {
    tag: 'JOIN',
    text: 'LEFT JOIN łączy tabelę customers z orders. Klient Maria nie ma żadnego zamówienia. Co pojawi się w wyniku zapytania dla Marii?',
    code: `<span class="kw">SELECT</span> c.name, o.amount
<span class="kw">FROM</span> <span class="tbl">customers</span> c
<span class="kw">LEFT JOIN</span> <span class="tbl">orders</span> o <span class="kw">ON</span> c.id = o.customer_id`,
    options: [
      { text: 'Wiersz z Maria jest pomijany — LEFT JOIN działa jak INNER JOIN', code: false },
      { text: 'Maria pojawia się z NULL w kolumnie amount', code: false },
      { text: 'Błąd SQL — NULL nie może wystąpić w wyniku JOIN', code: false },
      { text: 'Maria pojawia się z wartością 0 zamiast NULL', code: false },
    ],
    correct: 1,
    explanation: 'LEFT JOIN zwraca WSZYSTKIE wiersze z lewej tabeli (customers), nawet gdy nie ma dopasowania w prawej tabeli (orders). Kolumny z prawej tabeli dostają wartość NULL. Trick: LEFT JOIN + WHERE o.id IS NULL = klienci BEZ zamówień.'
  },
  {
    tag: 'Kolejność klauzul',
    text: 'W jakiej kolejności baza danych WYKONUJE klauzule zapytania SQL (nie pisze, a wykonuje)?',
    code: null,
    options: [
      { text: 'SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY', code: true },
      { text: 'FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY', code: true },
      { text: 'FROM → SELECT → WHERE → GROUP BY → ORDER BY → HAVING', code: true },
      { text: 'WHERE → FROM → GROUP BY → SELECT → HAVING → ORDER BY', code: true },
    ],
    correct: 1,
    explanation: 'Baza danych wykonuje klauzule w kolejności: FROM (skąd dane?) → WHERE (które wiersze?) → GROUP BY (grupowanie) → HAVING (filtr grup) → SELECT (które kolumny?) → ORDER BY → LIMIT. Dlatego alias nadany w SELECT nie jest dostępny w WHERE — WHERE wykonuje się wcześniej!'
  },
  {
    tag: 'WHERE vs HAVING',
    text: 'Chcesz znaleźć tylko te kategorie produktów, które mają łączną wartość zapasów powyżej 10 000 PLN. Który fragment jest poprawny?',
    code: `<span class="kw">SELECT</span> category, <span class="fn">SUM</span>(stock * price) <span class="kw">AS</span> total_value
<span class="kw">FROM</span> <span class="tbl">products</span>
<span class="kw">GROUP BY</span> category
<span class="cmt">-- co tutaj?</span>`,
    options: [
      { text: 'WHERE SUM(stock * price) > 10000', code: true },
      { text: 'WHERE total_value > 10000', code: true },
      { text: 'HAVING SUM(stock * price) > 10000', code: true },
      { text: 'HAVING stock * price > 10000', code: true },
    ],
    correct: 2,
    explanation: 'HAVING filtruje grupy PO wykonaniu GROUP BY — jedyne miejsce gdzie możesz użyć SUM(), COUNT() itd. w warunku. WHERE filtruje wiersze PRZED grupowaniem i nie zna jeszcze wartości agregowanych. Aliasów z SELECT (jak total_value) też nie możesz użyć w HAVING w większości baz.'
  },
  {
    tag: 'LIKE',
    text: 'Które zapytanie znajdzie wszystkie produkty, których nazwa kończy się na "Pro" (np. "Laptop Pro", "iPad Pro")?',
    code: null,
    options: [
      { text: "WHERE name LIKE 'Pro'", code: true },
      { text: "WHERE name LIKE 'Pro%'", code: true },
      { text: "WHERE name LIKE '%Pro'", code: true },
      { text: "WHERE name LIKE '%Pro%'", code: true },
    ],
    correct: 2,
    explanation: "% zastępuje dowolny ciąg znaków (0 lub więcej). '%Pro' = cokolwiek + kończy się na 'Pro'. 'Pro%' = zaczyna się od 'Pro'. '%Pro%' = zawiera 'Pro' gdziekolwiek. _ (podkreślnik) zastępuje dokładnie jeden znak."
  },
  {
    tag: 'NULL',
    text: 'Jakie zapytanie znajdzie wszystkich klientów, którzy nie podali swojej firmy (kolumna Company)?',
    code: `<span class="kw">SELECT</span> FirstName, LastName, Company
<span class="kw">FROM</span> <span class="tbl">Customer</span>
<span class="kw">WHERE</span> <span class="cmt">-- co tutaj?</span>`,
    options: [
      { text: 'Company = NULL', code: true },
      { text: 'Company = ""', code: true },
      { text: 'Company IS NULL', code: true },
      { text: 'NOT Company', code: true },
    ],
    correct: 2,
    explanation: 'NULL to brak wartości — nie możesz porównywać go przez = ani !=. Jedyna poprawna składnia to IS NULL (brak wartości) lub IS NOT NULL (ma wartość). Company = NULL zawsze zwraca FALSE — nawet gdy Company jest NULL!'
  },
  {
    tag: 'GROUP BY',
    text: 'Które zapytanie jest POPRAWNE syntaktycznie i semantycznie?',
    code: null,
    options: [
      { text: 'SELECT category, name, COUNT(*) FROM products GROUP BY category', code: true },
      { text: 'SELECT category, COUNT(*) FROM products GROUP BY category', code: true },
      { text: 'SELECT COUNT(*) FROM products WHERE category GROUP BY category', code: true },
      { text: 'SELECT category FROM products GROUP BY category HAVING name LIKE "A%"', code: true },
    ],
    correct: 1,
    explanation: 'Reguła GROUP BY: każda kolumna w SELECT musi albo być w GROUP BY, albo być wewnątrz funkcji agregującej (COUNT, SUM, AVG...). SELECT category, name, COUNT(*) ... GROUP BY category jest błędem — name nie jest ani w GROUP BY, ani w agregacie. HAVING może używać tylko kolumn z GROUP BY lub agregatów.'
  },
  {
    tag: 'COALESCE',
    text: 'Po wykonaniu LEFT JOIN klient bez zamówień ma NULL w kolumnie amount. Chcesz pokazać 0 zamiast NULL. Które rozwiązanie jest poprawne?',
    code: `<span class="kw">SELECT</span> c.name, <span class="cmt">-- ← co tutaj z o.amount?</span>
<span class="kw">FROM</span> <span class="tbl">customers</span> c
<span class="kw">LEFT JOIN</span> <span class="tbl">orders</span> o <span class="kw">ON</span> c.id = o.customer_id`,
    options: [
      { text: 'IFNULL(o.amount)', code: true },
      { text: 'COALESCE(o.amount, 0)', code: true },
      { text: 'REPLACE(o.amount, NULL, 0)', code: true },
      { text: 'NVL(o.amount, 0)', code: true },
    ],
    correct: 1,
    explanation: 'COALESCE(wartość, domyślna) — zwraca pierwszą wartość która nie jest NULL. COALESCE(o.amount, 0) zwróci amount jeśli istnieje, albo 0 gdy jest NULL. NVL() to Oracle. IFNULL() wymaga dwóch argumentów — IFNULL(o.amount, 0) też zadziałałoby w SQLite, ale COALESCE jest standardem SQL.'
  },
  {
    tag: 'Self-JOIN',
    text: 'Tabela Employee ma kolumnę ReportsTo (FK wskazujący na EmployeeId tego samego pracownika). Jak wypisać każdego pracownika razem z imieniem jego managera?',
    code: `<span class="kw">SELECT</span>
  e1.FirstName <span class="kw">AS</span> pracownik,
  <span class="cmt">-- imię managera?</span>
<span class="kw">FROM</span> <span class="tbl">Employee</span> e1
<span class="cmt">-- co tutaj?</span>`,
    options: [
      { text: 'INNER JOIN Employee e2 ON e1.EmployeeId = e2.EmployeeId', code: true },
      { text: 'LEFT JOIN Employee e2 ON e1.ReportsTo = e2.EmployeeId', code: true },
      { text: 'LEFT JOIN Manager e2 ON e1.ReportsTo = e2.EmployeeId', code: true },
      { text: 'SELF JOIN Employee ON ReportsTo = EmployeeId', code: true },
    ],
    correct: 1,
    explanation: 'Self-JOIN to JOIN tabeli z samą sobą pod różnymi aliasami. e1 = pracownik, e2 = manager. Łączymy: e1.ReportsTo (kto jest moim szefem) = e2.EmployeeId (id szefa). LEFT JOIN zamiast INNER JOIN bo CEO nie ma managera (ReportsTo = NULL) — LEFT JOIN pokaże go z NULL jako manager.'
  },
  {
    tag: 'Subquery',
    text: 'Chcesz znaleźć produkty droższe niż średnia cena WSZYSTKICH produktów. Które podzapytanie jest poprawne?',
    code: `<span class="kw">SELECT</span> name, price
<span class="kw">FROM</span> <span class="tbl">products</span>
<span class="kw">WHERE</span> price <span class="cmt">-- co tutaj?</span>`,
    options: [
      { text: '> (SELECT price FROM products WHERE id = 1)', code: true },
      { text: '> (SELECT AVG(price) FROM products)', code: true },
      { text: '> AVG(SELECT price FROM products)', code: true },
      { text: 'IN (SELECT price FROM products WHERE price > 100)', code: true },
    ],
    correct: 1,
    explanation: 'Subquery (podzapytanie) w WHERE wykonuje się najpierw i zwraca jedną wartość — tu: średnią cenę. Następnie zapytanie zewnętrzne porównuje każdy wiersz z tą średnią. Nie możesz użyć AVG() bezpośrednio w WHERE (bez GROUP BY) — agregaty w WHERE są niedozwolone. Subquery to jedyne wyjście.'
  },
  {
    tag: 'Indeksy',
    text: 'Kiedy warto tworzyć indeks na kolumnie tabeli?',
    code: `<span class="cmt">-- Tabela z 500 000 wierszy</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">orders</span>
<span class="kw">WHERE</span> customer_id = <span class="num">42</span>
  <span class="kw">AND</span> status = <span class="str">'pending'</span>
<span class="kw">ORDER BY</span> created_at <span class="kw">DESC</span>`,
    options: [
      { text: 'Na każdej kolumnie — indeksy zawsze przyspieszają zapytania', code: false },
      { text: 'Na kolumnach z dużą liczbą unikalnych wartości używanych w WHERE i JOIN', code: false },
      { text: 'Tylko na kolumnie PRIMARY KEY — inne indeksy nie mają sensu', code: false },
      { text: 'Indeksy spowalniają INSERT — lepiej ich nie używać', code: false },
    ],
    correct: 1,
    explanation: 'Indeks ma sens na kolumnach często używanych w WHERE, JOIN i ORDER BY — szczególnie gdy mają dużo unikalnych wartości (wysoka selektywność). Dla tego zapytania: indeks na customer_id i/lub status. Composite index (customer_id, status) byłby najlepszy. Indeksy przyspieszają SELECT ale spowalniają INSERT/UPDATE/DELETE — to trade-off. Nie indeksuj wszystkiego!'
  },
];

let current = 0;
let score = 0;
let userAnswers = [];
let answered = false;

function render() {
  const q = QUESTIONS[current];
  document.getElementById('q-badge').textContent = current + 1;
  document.getElementById('q-tag').textContent = q.tag;
  document.getElementById('q-text').textContent = q.text;

  // Code snippet
  const codeWrap = document.getElementById('code-wrap');
  const codeBlock = document.getElementById('code-block');
  if (q.code) {
    codeWrap.style.display = 'block';
    codeBlock.innerHTML = q.code;
  } else {
    codeWrap.style.display = 'none';
  }

  // Options
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.onclick = () => select(i);
    btn.innerHTML = `
      <span class="option-letter">${letters[i]}</span>
      <span class="${opt.code ? 'option-code' : ''}">${opt.text}</span>`;
    optEl.appendChild(btn);
  });

  // Feedback
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.style.display = 'none';

  // Next btn
  document.getElementById('next-btn').disabled = true;
  document.getElementById('next-btn').textContent = current < 9 ? 'Dalej →' : 'Zobacz wyniki';

  // Progress
  updateProgress();
  answered = false;
}

function select(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const opts = document.querySelectorAll('.option');
  const isCorrect = idx === q.correct;
  if (isCorrect) score++;
  userAnswers.push(idx);

  opts.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx && !isCorrect) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  const fbIcon = document.getElementById('fb-icon');
  const fbText = document.getElementById('fb-text');
  fb.classList.add('show');

  if (isCorrect) {
    fb.classList.add('correct');
    fbIcon.textContent = '✓';
    fbText.textContent = 'Dobrze! ' + q.explanation;
  } else {
    fb.classList.add('wrong');
    fbIcon.textContent = '✗';
    fbText.textContent = 'Niepoprawnie. ' + q.explanation;
  }

  document.getElementById('next-btn').disabled = false;
  updateProgress();
}

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current >= QUESTIONS.length) {
    showScore();
  } else {
    render();
  }
}

function updateProgress() {
  const pct = ((current + (answered ? 1 : 0)) / QUESTIONS.length) * 100;
  document.getElementById('prog-fill').style.width = Math.max(pct, 5) + '%';
  document.getElementById('prog-label').textContent =
    `Pytanie ${Math.min(current + 1, 10)} z 10`;
  document.getElementById('prog-score').textContent =
    answered || current > 0 ? `${score} / ${Math.min(current + (answered ? 1 : 0), 10)}` : '';
}

function showScore() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';
  document.getElementById('final-score').textContent = score;

  // Ring animation
  const circumference = 326.7;
  const pct = score / 10;
  const fill = document.getElementById('ring-fill');
  fill.style.stroke = pct >= .7 ? '#3fb950' : pct >= .5 ? '#e3b341' : '#f85149';
  setTimeout(() => {
    fill.style.strokeDashoffset = circumference * (1 - pct);
  }, 100);

  // Label
  const labels = [
    [10, '🏆 Perfekcja!', 'Wszystkie 10 poprawnie — mistrz SQL!'],
    [9,  '🥇 Świetnie!', 'Prawie ideał — znakomita znajomość SQL.'],
    [8,  '🥈 Bardzo dobrze!', 'Solidna wiedza, parę szczegółów do doprecyzowania.'],
    [7,  '🥉 Dobrze!', 'Podstawy opanowane, warto powtórzyć zaawansowane tematy.'],
    [6,  '📚 Nieźle', 'Zaliczone, ale jest co powtarzać — wróć do notatnika.'],
    [0,  '💪 Czas na powtórkę', 'Wróć do Lekcji 13 i spróbuj jeszcze raz!'],
  ];
  for (const [min, lbl, sub] of labels) {
    if (score >= min) {
      document.getElementById('score-label').textContent = lbl;
      document.getElementById('score-sub').textContent = sub;
      break;
    }
  }

  // Breakdown dots
  const bd = document.getElementById('score-breakdown');
  bd.innerHTML = '';
  userAnswers.forEach((ans, i) => {
    const d = document.createElement('div');
    d.className = 'score-dot' + (ans === QUESTIONS[i].correct ? '' : ' wrong');
    bd.appendChild(d);
  });

  // Review wrong answers
  const rv = document.getElementById('review-list');
  rv.innerHTML = '';
  userAnswers.forEach((ans, i) => {
    if (ans !== QUESTIONS[i].correct) {
      const q = QUESTIONS[i];
      const div = document.createElement('div');
      div.className = 'review-item wrong-r';
      div.innerHTML = `
        <span class="review-q">P${i+1}</span>
        <div class="review-text">
          ${q.text.substring(0, 80)}…
          <div class="review-correct">✓ Poprawna: ${['A','B','C','D'][q.correct]}. ${q.options[q.correct].text}</div>
        </div>`;
      rv.appendChild(div);
    }
  });
  if (userAnswers.every((ans, i) => ans === QUESTIONS[i].correct)) {
    rv.innerHTML = '<div style="text-align:center;color:var(--green);font-size:14px;padding:12px">🎉 Wszystkie odpowiedzi poprawne!</div>';
  }

  // Update progress
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-label').textContent = 'Quiz zakończony';
  document.getElementById('prog-score').textContent = `${score} / 10`;
}

function restart() {
  current = 0; score = 0; userAnswers = []; answered = false;
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('ring-fill').style.strokeDashoffset = '326.7';
  render();
}

// Init
render();
</script>
</body>
</html>
